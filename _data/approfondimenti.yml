      - title: "Tre colonne"
        url: /dashboards/tre-colonne.html
        tag_label: "Reperto · Speciale"
        description: "Gli stessi tratti testuali descritti da tre mondi che non si sono mai parlati: le guide per riconoscere i testi scritti dall'AI, la letteratura clinica sulla lingua autistica, gli strumenti compensativi di PDP e PEI."

      - title: "Fahrenheit 451: la mappa esplorabile"
        url: /dashboards/fahrenheit-451.html
        tag_label: "Cyberpsicologia · Speciale"
        description: "Companion per addetti ai lavori dell'articolo su Bradbury, con lo strato di evidenza su lettura profonda, attenzione e smartphone a scuola. Per chi insegna, forma o fa clinica."

      - title: "Educazione sessuo-affettiva e consenso"
        url: /dashboards/educazione-sessuo-affettiva-consenso-with-menu.html
        tag_label: "Educazione · Speciale"
        description: "Una lettura della legge Valditara sul consenso informato in ambito scolastico oltre i due copioni opposti: cosa dice il testo, cosa c'era prima, cosa dice l'evidenza, e dove finisce il fatto e comincia il valore."

