# URL canonico del sito. Serve a jekyll-sitemap e ai tag canonical.
url: https://ivanferrero.it
baseurl: ""
title: "Ivan Ferrero"
description: "Psicologo psicoterapeuta e cyberpsicologo. Dashboard, osservatorio e archivio."

# Ivan Ferrero — ivanferrero.it
# Jekyll config per GitHub Pages

collections:
  dialoghi:
    output: true
    permalink: /dialoghi/:title/

  # Archivio BullismoOnline (2009-2020) - selezione ragionata degli articoli del
  # portale divulgativo, ricostruita su ivanferrero.it l'11-12/08/2026.
  # Il repository IvanPsy/bullismoonline resta la copia integrale non modificata;
  # ivanferrero.it e' la versione CANONICA (vedi rel=canonical nei due sensi).
  # Convenzione frontmatter:
  #   layout: archivio-articolo   (impostato nei defaults qui sotto)
  #   title / date  -> DATA ORIGINALE di pubblicazione, non toccare
  #   autore, slug, pila (A = regge ancora, B = documento d'epoca)
  #   sommario, perche_regge, nota_epoca (solo pila B), originale (URL archivio)
  archivio:
    output: true
    permalink: /archivio/:title/

  # Osservatorio — intelligence brief settimanali (TECH, EDU, CYBER, INCLUDE).
  # Convenzione frontmatter di un report:
  #   layout:     osservatorio-report   (impostato in defaults qui sotto, opzionale nel file)
  #   title:      "Brief TECH — settimana del 20 aprile 2026"
  #   date:       2026-04-20             (lunedi della settimana coperta)
  #   stream:     tech                   (uno tra: tech, edu, cyber, include)
  #   categories: [tech]                 (stesso valore di stream — pilota il permalink)
  #   slug:       "2026-04-20"           (componente data dell'URL)
  #   tldr:       "Riassunto in 1-2 frasi (markdown supportato)."
  # Permalink risultante: /osservatorio/tech/2026-04-20/
  osservatorio:
    output: true
    permalink: /osservatorio/:categories/:slug/

defaults:
  - scope:
      path: ""
      type: osservatorio
    values:
      layout: osservatorio-report

  - scope:
      path: ""
      type: archivio
    values:
      layout: archivio-articolo

# Plugin (nella whitelist di GitHub Pages)
plugins:
  - jekyll-sitemap

# Esclusioni dal build
exclude:
  - CLAUDE.md
  - README.md
  - .DS_Store
