<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Come si scrive un video. Percorso a tappe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F6; --card:#FFFFFF; --ink:#1B2430; --soft:#4A5565; --line:#C5CED9;
  --primary:#1F4FA8; --primary-ink:#FFFFFF;
  --dove:#2459C9; --dove-bg:#E3ECFF;
  --quando:#6B3FC4; --quando-bg:#EEE7FF;
  --vede:#0B6E80; --vede-bg:#DDF2F5;
  --parla:#B4540A; --parla-bg:#FFEADB;
  --neutro:#3D4757; --neutro-bg:#E6E9EE;
  --ok:#1D6B33; --ok-bg:#E1F3E5;
  --retry:#4A5565; --retry-bg:#EEF0F3;
  --star:#B7791F;
  --fs:20px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161A20; --card:#1F252D; --ink:#E6E9EE; --soft:#AAB3C0; --line:#3A4452;
  --primary:#8FB0F5; --primary-ink:#0E1522;
  --dove:#8FB0F5; --dove-bg:#1D2A45; --quando:#C1A8F5; --quando-bg:#2A2142;
  --vede:#73CAD8; --vede-bg:#14303A; --parla:#F4AE72; --parla-bg:#3A2616;
  --neutro:#C9D0DA; --neutro-bg:#2B323C; --ok:#86D79B; --ok-bg:#15311E; --retry:#C9D0DA; --retry-bg:#2B323C; --star:#F0C060;}}
:root[data-theme="dark"]{
  --bg:#161A20; --card:#1F252D; --ink:#E6E9EE; --soft:#AAB3C0; --line:#3A4452;
  --primary:#8FB0F5; --primary-ink:#0E1522;
  --dove:#8FB0F5; --dove-bg:#1D2A45; --quando:#C1A8F5; --quando-bg:#2A2142;
  --vede:#73CAD8; --vede-bg:#14303A; --parla:#F4AE72; --parla-bg:#3A2616;
  --neutro:#C9D0DA; --neutro-bg:#2B323C; --ok:#86D79B; --ok-bg:#15311E; --retry:#C9D0DA; --retry-bg:#2B323C; --star:#F0C060;}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',Verdana,Arial,sans-serif;line-height:1.5;display:flex;flex-direction:column}
:focus-visible{outline:4px solid var(--primary);outline-offset:3px}
svg.i{width:1.2em;height:1.2em;vertical-align:-0.22em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
svg.i.fill{fill:currentColor;stroke:none}

/* barra delle tappe: il ciak */
.top{background:var(--card);border-bottom:2px solid var(--line);padding:10px 14px 8px}
.wrap{max-width:760px;margin:0 auto}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tools p{margin:0;font-weight:700;font-size:.9rem}
.tools .grp{display:flex;gap:6px}
#restart{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;list-style:none;margin:0;padding:0}
.strip li{border:2px solid var(--line);border-radius:6px;padding:6px 4px;text-align:center;font-size:.72rem;line-height:1.25;background:var(--card)}
.strip li b{display:block;font-size:1rem}
.strip li.now{border:4px solid var(--primary)}
.strip li.done{background:var(--ok-bg);border-color:var(--ok)}
.strip li .st{display:block;color:var(--soft)}
.strip li.done .st{color:var(--ok);font-weight:700}
.nowline{margin:8px 0 0;font-size:.85rem;color:var(--soft)}
.nowline b{color:var(--ink)}

/* area della carta */
main{flex:1;overflow-y:auto}
.stage{max-width:760px;margin:0 auto;padding:18px 14px 24px}
.count{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:.9rem;color:var(--soft)}
.dots{display:flex;gap:6px}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--soft)}
.dots span.on{background:var(--primary);border-color:var(--primary)}
.dots span.past{background:var(--soft)}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:22px 22px 18px}
.card h2{font-size:1.45rem;line-height:1.3;margin:0 0 14px}
.card h2:focus{outline:none}
.big-icons{display:flex;align-items:center;gap:14px;margin-bottom:14px;color:var(--ink)}
.big-icons svg.i{width:64px;height:64px;stroke-width:1.6}
.big-icons .arr svg.i{width:36px;height:36px;color:var(--soft)}
.card p{font-size:1.2rem;margin:0 0 .7em}
.card img{width:100%;max-width:340px;border-radius:10px;border:1px solid var(--line);display:block;margin:0 0 14px}
.example{border:2px dashed var(--line);border-radius:10px;padding:12px 16px;margin:10px 0}
.example p{font-size:1.1rem}
.ex-label{display:block;font-size:.85rem;font-weight:700;color:var(--soft);margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:.35em;border:2px solid;border-radius:8px;padding:.1em .5em;font-weight:700;white-space:nowrap}
.dove{color:var(--dove);background:var(--dove-bg);border-color:var(--dove)}
.quando{color:var(--quando);background:var(--quando-bg);border-color:var(--quando)}
.vede{color:var(--vede);background:var(--vede-bg);border-color:var(--vede)}
.parla{color:var(--parla);background:var(--parla-bg);border-color:var(--parla)}
.neutro{color:var(--neutro);background:var(--neutro-bg);border-color:var(--neutro)}
.chip.dove,.chip.quando,.chip.vede,.chip.parla,.chip.neutro{color:var(--ink)}
.chip.dove svg{color:var(--dove)}.chip.quando svg{color:var(--quando)}.chip.vede svg{color:var(--vede)}.chip.parla svg{color:var(--parla)}
.steps4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0}
.steps4 div{border:2px solid var(--line);border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:700}
.steps4 svg.i{width:40px;height:40px}
.mono{font-family:'Courier Prime','Courier New',monospace;font-size:1.05rem}
.yesno{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.yesno div{border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.yesno .tag{display:flex;align-items:center;gap:6px;font-weight:700;margin-bottom:4px}
.yes .tag{color:var(--ok)} .no .tag{color:var(--soft)}
@media (max-width:520px){.yesno,.steps4{grid-template-columns:1fr}}

/* attività */
.q{font-size:1.25rem;font-weight:700;margin:0 0 12px}
.situ{background:var(--neutro-bg);border-radius:10px;padding:12px 16px;font-size:1.2rem;margin:0 0 14px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{min-height:64px;min-width:64px;padding:12px 20px;font:inherit;font-size:1.15rem;font-weight:700;border:3px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:10px}
.opt:hover{border-color:var(--primary)}
.opt.okay{border-color:var(--ok);background:var(--ok-bg)}
.opt.hint{border-width:6px;border-color:var(--primary)}
.opt.hint::after{content:"Guarda qui";font-size:.8rem;font-weight:400;margin-left:6px}
.opt.cat-dove{border-color:var(--dove)}.opt.cat-vede{border-color:var(--vede)}.opt.cat-parla{border-color:var(--parla)}
.opt[disabled]{opacity:.5;cursor:default}
.fb{margin:14px 0 0;padding:12px 16px;border-radius:10px;font-size:1.15rem;display:flex;gap:10px;align-items:flex-start;border-left:8px solid}
.fb[hidden]{display:none}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.retry{background:var(--retry-bg);border-color:var(--retry)}
.fb svg.i{width:1.4em;height:1.4em}
.slots{list-style:none;padding:0;margin:14px 0}
.slots li{min-height:60px;border:3px dashed var(--line);border-radius:10px;margin-bottom:8px;padding:12px 14px;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.slots li b{min-width:4.2em;color:var(--soft)}
.slots li.full{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.buildline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:56px;border:3px dashed var(--line);border-radius:10px;padding:10px;margin:0 0 14px;font-family:'Courier Prime','Courier New',monospace;font-size:1.15rem}
.buildline .chip{font-family:inherit}
.sp-row{border:3px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-family:'Courier Prime','Courier New',monospace;font-size:1.05rem;line-height:1.4}
.sp-row.cur{border-width:5px;border-color:var(--primary)}
.sp-row .lab{display:none;font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:.8rem;font-weight:700;margin-bottom:2px}
.sp-row.dove,.sp-row.vede,.sp-row.parla{color:var(--ink)}
.sp-row.dove .lab,.sp-row.vede .lab,.sp-row.parla .lab{display:flex;align-items:center;gap:6px}
.sp-row.dove .lab{color:var(--dove)}.sp-row.vede .lab{color:var(--vede)}.sp-row.parla .lab{color:var(--parla)}
.sp-row .ind{padding-left:6ch;display:block}

/* schermate speciali */
.center{text-align:center}
.stars{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0 16px;color:var(--star)}
.stars svg.i{width:48px;height:48px}
.stars .off{color:var(--line)}
.choices{display:grid;gap:10px;margin-top:10px}
.choices .opt{width:100%;justify-content:flex-start}
.bar{height:22px;border:2px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card);margin:14px 0}
.bar div{height:100%;background:var(--primary);width:0}
.learned{list-style:none;padding:0;margin:0 0 14px;text-align:left}
.learned li{display:flex;gap:12px;align-items:center;font-size:1.15rem;padding:8px 0;border-bottom:1px solid var(--line)}
.learned svg.i{width:32px;height:32px}
details{margin-top:22px;border-top:2px solid var(--line);padding-top:10px;font-size:.9rem}
details summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:700}
details p,details li{font-size:.9rem!important}

/* barra inferiore */
.bottom{background:var(--card);border-top:2px solid var(--line);padding:10px 14px}
.bottom .wrap{display:grid;grid-template-columns:1fr auto 1.4fr;gap:10px;align-items:center}
.nav{min-height:64px;font:inherit;font-size:1.15rem;font-weight:700;border-radius:12px;border:3px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px}
.nav.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.nav[disabled]{opacity:.4;cursor:not-allowed}
.small{min-height:48px;min-width:48px;font:inherit;font-size:.9rem;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;padding:6px 10px}
body.confirming #next,body.confirming #back,body.confirming .why{display:none}
body.confirming .bottom .wrap{grid-template-columns:1fr}
.card.compact{padding:16px}.card.compact p{font-size:1.05rem;margin-bottom:.4em}.card.compact .choices .opt{min-height:56px;padding:8px 14px}
.why{grid-column:1/-1;margin:0;text-align:center;font-size:.85rem;color:var(--soft);min-height:1.2em}
@media (max-width:420px){.tools p{display:none}.tools{justify-content:flex-end}}
@media (max-width:520px){.tools p{font-size:.8rem}.small{padding:6px 8px}.strip li{padding:4px 2px}.strip li .nm{display:none}.strip li .st{font-size:.62rem}.strip li b{font-size:1rem}
.bottom .wrap{grid-template-columns:1fr 1fr}.bottom #next{grid-column:1/-1;grid-row:1}.nav{font-size:1rem}}
.strip li{min-width:0;overflow-wrap:anywhere}
</style>
</head>
<body>
<!-- integrazione sito: barra minima con il menu del sito su richiesta -->
<div id="site-menu" data-lezioni-menu="minimal" data-back="/lezioni-accessibili/scrivere-per-audiovisivo/"></div>
<header class="top"><div class="wrap">
  <div class="tools"><p>Come si scrive un video</p>
    <div class="grp" role="group" aria-label="Dimensione del testo">
      <button type="button" class="small" id="fs-down" aria-label="Testo più piccolo">A-</button>
      <button type="button" class="small" id="fs-up" aria-label="Testo più grande">A+</button>
      <button type="button" class="small" id="restart"></button>
    </div></div>
  <ol class="strip" id="strip" aria-label="Le 6 tappe"></ol>
  <p class="nowline" id="nowline" role="status"></p>
</div></header>

<main id="main"><div class="stage" id="stage"></div></main>

<footer class="bottom"><div class="wrap">
  <button type="button" class="nav" id="back"></button>
  <button type="button" class="nav" id="listen" aria-label="Ascolta questa carta"></button>
  <button type="button" class="nav primary" id="next"></button>
  <p class="why" id="why" aria-live="polite"></p>
</div></footer>

<script>
(function(){
/* ---------- icone (disegnate a mano, stile unico) ---------- */
var P={
 pencil:'<path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/>',
 camera:'<rect x="2" y="7" width="13" height="10" rx="2"/><path d="M15 11l6-3v8l-6-3z"/>',
 arrow:'<path d="M4 12h15"/><path d="M13 6l6 6-6 6"/>',
 back:'<path d="M20 12H5"/><path d="M11 6l-6 6 6 6"/>',
 paper:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 16h7"/>',
 bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>',
 book:'<path d="M3 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H3z"/><path d="M21 5h-7a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h7z"/>',
 list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/>',
 script:'<path d="M6 3h12v18H6z"/><path d="M9 7h6M12 11h4M12 13h3M9 16h6"/>',
 house:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
 tree:'<circle cx="12" cy="9" r="6"/><path d="M12 15v6M9 21h6"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 ear:'<path d="M7 9a5 5 0 0 1 10 0c0 3-2 4-3 5.5S13 18 11.5 19.5 7 20 7 17"/><path d="M10 10a2 2 0 0 1 4 0"/>',
 speech:'<path d="M4 5h16v11H9l-5 4z"/>',
 pin:'<path d="M12 21s-7-6-7-12a7 7 0 0 1 14 0c0 6-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
 check:'<path d="M4 12l5 5L20 6"/>',
 cross:'<path d="M6 6l12 12M18 6L6 18"/>',
 retry:'<path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v4h4"/>',
 pause:'<path d="M9 5v14M15 5v14"/>',
 speaker:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/>',
 stop:'<rect x="6" y="6" width="12" height="12" rx="1"/>',
 home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'
};
function ic(n,fill){return '<svg class="i'+(fill?' fill':'')+'" viewBox="0 0 24 24" aria-hidden="true">'+P[n]+'</svg>'}
function chip(cls,icon,t){return '<span class="chip '+cls+'">'+ic(icon)+t+'</span>'}
var DOVE=function(t){return chip('dove','pin',t)}, QUANDO=function(t){return chip('quando','clock',t)},
    VEDE=function(t){return chip('vede','eye',t)}, PARLA=function(t){return chip('parla','speech',t)},
    NEUTRO=function(i,t){return chip('neutro',i,t)};

/* ---------- contenuti: 6 tappe ---------- */
var T=[
 {name:'Prima si scrive', icon:'pencil', cards:[
  {type:'info', icons:['pencil','arrow','camera'], title:'Prima si scrive. Poi si gira.',
   html:'<p>Per fare un video, prima scriviamo su un foglio.</p><p>Dopo, facciamo il video.</p>'},
  {type:'info', icons:['camera'], title:'Che cosa vuol dire «girare»?',
   html:'<p><b>Girare</b> vuol dire: fare le riprese con la videocamera.</p>'},
  {type:'info', icons:['paper','check'], title:'Perché scriviamo prima?',
   html:'<div class="yesno"><div class="yes"><span class="tag">'+ic('paper')+' Il foglio</span>Cambiare un foglio è facile.</div><div class="no"><span class="tag">'+ic('camera')+' Il video</span>Cambiare un video è difficile. Costa tanti soldi.</div></div>'},
  {type:'order', title:'Prova tu', q:'Che cosa si fa prima? Premi le parole in ordine.', labels:['Prima','Poi'],
   items:[{t:'Girare',i:'camera'},{t:'Scrivere',i:'pencil'}], correct:['Scrivere','Girare'],
   ok:'Giusto! Prima si scrive, poi si gira.'}
 ]},
 {name:'Le 4 fasi', icon:'list', cards:[
  {type:'info', icons:['bulb','book','list','script'], title:'Per scrivere un video ci sono 4 fasi.',
   html:'<div class="steps4"><div>'+ic('bulb')+'1. Idea</div><div>'+ic('book')+'2. Soggetto</div><div>'+ic('list')+'3. Scaletta</div><div>'+ic('script')+'4. Sceneggiatura</div></div><p>Una fase alla volta. Guardiamo un esempio: uno spot sul casco.</p><p>Uno <b>spot</b> è un video breve con un messaggio.</p>'},
  {type:'info', icons:['bulb'], title:'Fase 1. L\u2019idea.',
   html:'<p>L\u2019idea è piccola. Bastano poche parole.</p><div class="example"><span class="ex-label">Esempio</span><p>Uno spot per dire: metti il casco.</p></div>'},
  {type:'info', icons:['book'], title:'Fase 2. Il soggetto.',
   html:'<p>Il soggetto racconta tutta la storia, fino alla fine.</p><div class="example"><span class="ex-label">Esempio</span><p>Un bambino prende il casco del fratello. Il bambino gioca con il casco. Il bambino cade. Non si fa male, perché ha il casco.</p></div>'},
  {type:'info', icons:['list'], title:'Fase 3. La scaletta.',
   html:'<p>La scaletta è un elenco. Ogni riga è una scena.</p><div class="example"><span class="ex-label">Esempio</span><p>1. Camera del fratello: il bambino prende il casco.<br>2. Cucina: il bambino corre con il triciclo.<br>3. Camera del bambino: il bambino gioca.<br>4. Corridoio: il bambino cade.</p></div>'},
  {type:'info', icons:['script'], title:'Fase 4. La sceneggiatura.',
   html:'<p>La sceneggiatura scrive tutto: dove siamo, che cosa si vede, che cosa dicono i personaggi.</p><p>Nelle prossime tappe impari a leggerla.</p>'},
  {type:'order', title:'Prova tu', q:'Metti le 4 fasi in ordine. Premi la prima fase, poi la seconda, e così via.', labels:['1.','2.','3.','4.'],
   items:[{t:'Scaletta',i:'list'},{t:'Idea',i:'bulb'},{t:'Sceneggiatura',i:'script'},{t:'Soggetto',i:'book'}],
   correct:['Idea','Soggetto','Scaletta','Sceneggiatura'], ok:'Giusto! Idea, soggetto, scaletta, sceneggiatura.'}
 ]},
 {name:'La scena', icon:'pin', cards:[
  {type:'info', icons:['pin','clock'], title:'Che cos\u2019è una scena?',
   html:'<p>Una scena è un pezzo della storia.</p><p>Nella scena il posto è sempre lo stesso: '+DOVE('DOVE')+'</p><p>Nella scena anche il tempo è sempre lo stesso: '+QUANDO('QUANDO')+'</p>'},
  {type:'info', icons:['pin'], title:'Cambia il posto: nuova scena.',
   html:'<div class="example"><p>'+DOVE('CUCINA')+'</p><p>poi</p><p>'+DOVE('CORRIDOIO')+'</p></div><p>Il posto cambia. Sono <b>2 scene</b>.</p>'},
  {type:'info', icons:['clock'], title:'Cambia il tempo: nuova scena.',

/* ---------- stato ---------- */
function st(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var S={screen:'home',t:0,c:0}; var done=[]; try{done=JSON.parse(st('tappe-done')||'[]')}catch(e){done=[]}
var solved={}; var timer=null;
var stage=document.getElementById('stage'), nextB=document.getElementById('next'), backB=document.getElementById('back'),
    listenB=document.getElementById('listen'), why=document.getElementById('why');

function save(){st('tappe-done',JSON.stringify(done));st('tappe-pos',JSON.stringify(S))}
function stripDraw(){
  var h='';T.forEach(function(tp,i){
    var isDone=done.indexOf(i)>=0, isNow=(S.screen==='card'&&S.t===i);
    h+='<li class="'+(isDone?'done ':'')+(isNow?'now':'')+'" '+(isNow?'aria-current="step"':'')+'><b>'+(i+1)+'</b><span class="nm">'+tp.name+'</span><span class="st">'+(isNow?'adesso':(isDone?'fatta':'da fare'))+'</span></li>';});
  document.getElementById('strip').innerHTML=h;
  var nl=document.getElementById('nowline');
  if(S.screen==='card'){var nx=T[S.t+1];nl.innerHTML='<b>Adesso:</b> tappa '+(S.t+1)+', '+T[S.t].name+'. <b>Dopo:</b> '+(nx?'tappa '+(S.t+2)+', '+nx.name+'.':'la fine del percorso.')}
  else nl.textContent='Tappe finite: '+done.length+' su 6.';
}
function navSet(backTxt,backOn,nextTxt,nextOn,msg){
  backB.innerHTML=ic('back')+backTxt; backB.disabled=!backOn;
  nextB.innerHTML=nextTxt+' '+ic('arrow'); nextB.disabled=!nextOn;
  why.textContent=msg||'';
}
function focusTitle(){var h=stage.querySelector('h2');if(h){h.setAttribute('tabindex','-1');h.focus()}}
function render(){
  stopSpeak(); if(timer){clearInterval(timer);timer=null}
  document.body.classList.toggle('confirming',S.screen==='confirm');
  stripDraw(); save();
  document.getElementById('main').scrollTop=0;
  if(S.screen==='home') return home();
  if(S.screen==='tdone') return tappaDone();
  if(S.screen==='pause') return pause();
  if(S.screen==='stop') return stopDay();
  if(S.screen==='end') return endAll();
  if(S.screen==='confirm') return confirmRestart();
  var tp=T[S.t], card=tp.cards[S.c], key=S.t+'-'+S.c;
  var dots='';for(var i=0;i<tp.cards.length;i++)dots+='<span class="'+(i===S.c?'on':(i<S.c?'past':''))+'"></span>';
  stage.innerHTML='<p class="count"><span class="dots" aria-hidden="true">'+dots+'</span>Carta '+(S.c+1)+' di '+tp.cards.length+'</p><article class="card" id="card"></article>';
  var el=document.getElementById('card');
  if(card.type==='info'){
    var icons=card.icons.map(function(n,j){return (n==='arrow'?'<span class="arr">'+ic(n)+'</span>':ic(n,n==='star'))}).join('');
    el.innerHTML='<div class="big-icons" aria-hidden="true">'+icons+'</div><h2>'+card.title+'</h2>'+(S.t===0&&S.c===0?IMG:'')+card.html;
  } else ACT[card.type](el,card,key);
  var isAct=card.type!=='info', ok=!isAct||solved[key];
  navSet('Indietro',S.c>0,S.c===tp.cards.length-1?'Finisco la tappa':'Avanti',ok,ok?'':'Rispondi. Poi il pulsante «Avanti» si accende.');
  focusTitle();
}
function unlock(key){solved[key]=true;nextB.disabled=false;why.textContent='Adesso puoi andare avanti.'}

/* ---------- attività ---------- */
function fb(box,kind,txt){box.hidden=false;box.className='fb '+kind;box.innerHTML=ic(kind==='ok'?'check':'retry')+'<span>'+txt+'</span>'}
function btn(t,i,extra){return '<button type="button" class="opt '+(extra||'')+'">'+ic(i)+t+'</button>'}
var ACT={
 choice:function(el,cd,key){
  el.innerHTML='<h2>'+cd.title+'</h2><p class="situ">'+cd.situ+'</p><p class="q">'+cd.q+'</p><div class="opts" role="group" aria-label="Risposte">'+cd.opts.map(function(o){return btn(o.t,o.i)}).join('')+'</div><p class="fb" hidden aria-live="polite"></p>';
  var bs=el.querySelectorAll('.opt'), box=el.querySelector('.fb'), wrong=0;
  if(solved[key]){bs[cd.c].classList.add('okay');fb(box,'ok',cd.ok);return}
  bs.forEach(function(b,j){b.onclick=function(){
    if(solved[key])return;
    if(j===cd.c){b.classList.remove('hint');b.classList.add('okay');fb(box,'ok',cd.ok);unlock(key)}
    else{wrong++;fb(box,'retry','Non è questa. Riprova. '+cd.ko);if(wrong>=2)bs[cd.c].classList.add('hint')}}});
 },
 order:function(el,cd,key){
  el.innerHTML='<h2>'+cd.title+'</h2><p class="q">'+cd.q+'</p><div class="opts" role="group" aria-label="Parole da mettere in ordine"></div><ol class="slots"></ol><p class="fb" hidden aria-live="polite"></p>';
  var pool=el.querySelector('.opts'), slots=el.querySelector('.slots'), box=el.querySelector('.fb'), placed=solved[key]?cd.correct.slice():[], wrong=0;
  function draw(){
    slots.innerHTML=cd.labels.map(function(l,i){return '<li class="'+(placed[i]?'full':'')+'"><b>'+l+'</b>'+(placed[i]?ic('check')+placed[i]:'(vuoto)')+'</li>'}).join('');
    pool.innerHTML='';cd.items.forEach(function(it){if(placed.indexOf(it.t)>=0)return;
      var b=document.createElement('button');b.type='button';b.className='opt';b.innerHTML=ic(it.i)+it.t;
      if(wrong>=2&&it.t===cd.correct[placed.length])b.classList.add('hint');
      b.onclick=function(){
        if(it.t===cd.correct[placed.length]){placed.push(it.t);box.hidden=true;wrong=0;
          if(placed.length===cd.correct.length){fb(box,'ok',cd.ok);unlock(key)}draw();}
        else{wrong++;fb(box,'retry','Non è questa. Riprova. Pensa: che cosa viene '+(placed.length?'dopo «'+placed[placed.length-1]+'»':'per prima')+'?');draw()}};
      pool.appendChild(b)});
  }
  draw(); if(solved[key])fb(box,'ok',cd.ok);
 },
 build:function(el,cd,key){
  el.innerHTML='<h2>'+cd.title+'</h2><p class="situ">'+cd.situ+'</p><p class="q">Costruisci l\u2019intestazione. Un pezzo alla volta.</p><div class="buildline" aria-label="Intestazione costruita"></div><p class="q step"></p><div class="opts" role="group" aria-label="Scegli"></div><p class="fb" hidden aria-live="polite"></p>';
  var line=el.querySelector('.buildline'), sq=el.querySelector('.step'), pool=el.querySelector('.opts'), box=el.querySelector('.fb'), k=solved[key]?cd.steps.length:0, wrong=0;
  function draw(){
    line.innerHTML=cd.steps.slice(0,k).map(function(s){return chip(s.cls,s.icon,s.opts[s.c].t)}).join(' ')||'<span style="color:var(--soft)">(ancora vuota)</span>';
    if(k>=cd.steps.length){sq.textContent='';pool.innerHTML='';fb(box,'ok',cd.ok);unlock(key);return}
    var s=cd.steps[k]; sq.textContent='Passo '+(k+1)+' di 3. '+s.q;
    pool.innerHTML=s.opts.map(function(o,j){return btn(o.t,o.i,(wrong>=2&&j===s.c)?'hint':'')}).join('');
    pool.querySelectorAll('.opt').forEach(function(b,j){b.onclick=function(){
      if(j===s.c){k++;wrong=0;box.hidden=true;draw()}
      else{wrong++;fb(box,'retry','Non è questa. Riprova. '+s.ko);draw();box.hidden=false}}});
  }
  draw();
 },
 label:function(el,cd,key){
  el.innerHTML='<h2>'+cd.title+'</h2><p class="q">'+cd.q+'</p><div class="rows"></div><div class="opts" role="group" aria-label="Colori"></div><p class="fb" hidden aria-live="polite"></p>';
  var rows=el.querySelector('.rows'), pool=el.querySelector('.opts'), box=el.querySelector('.fb'), k=solved[key]?cd.rows.length:0, wrong=0;
  function lab(c){var x=CATS.filter(function(z){return z.c===c})[0];return '<span class="lab">'+ic(x.i)+x.t+'</span>'}
  function draw(){
    rows.innerHTML=cd.rows.map(function(r,i){var d=i<k;return '<div class="sp-row '+(d?r.c:'')+(i===k?' cur':'')+'"'+(i===k?' aria-current="true"':'')+'>'+(d?lab(r.c):'')+r.h+'</div>'}).join('');
    if(k>=cd.rows.length){pool.innerHTML='';fb(box,'ok',cd.ok);unlock(key);return}
    pool.innerHTML=CATS.map(function(x){return btn(x.t,x.i,x.c+' cat-'+x.c+((wrong>=2&&x.c===cd.rows[k].c)?' hint':''))}).join('');
    pool.querySelectorAll('.opt').forEach(function(b,j){b.onclick=function(){
      if(CATS[j].c===cd.rows[k].c){k++;wrong=0;box.hidden=true;draw()}
      else{wrong++;draw();fb(box,'retry','Non è questo colore. Riprova. '+HINT[cd.rows[k].c])}}});
  }
  draw();
 }
};

function home(){
  var started=done.length>0;
  stage.innerHTML='<article class="card"><div class="big-icons" aria-hidden="true">'+ic('pencil')+'<span class="arr">'+ic('arrow')+'</span>'+ic('camera')+'</div>'+

  '<div class="example"><span class="ex-label">I colori hanno sempre lo stesso significato</span><p>'+DOVE('DOVE')+' '+QUANDO('QUANDO')+'</p><p>'+VEDE('COSA SI VEDE')+' '+PARLA('CHI PARLA')+'</p></div>'+
  (started?'<p>Hai già finito '+done.length+' tappe su 6.</p>':'')+
  '<details><summary>Per l\u2019insegnante</summary><p>Percorso ridotto dal capitolo 1 per un alunno con disturbo dello spettro autistico e bisogni di supporto più alti. Contenuti tenuti: prima si scrive poi si gira; 4 fasi (il trattamento, facoltativo, è omesso); scena come unità di luogo e tempo; intestazione; descrizione osservabile; dialogo. Omessi: produzione, sequenza, formattazione all\u2019italiana, Courier, SIAE, serialità.</p><p>Ogni colore ha un solo significato ed è sempre accompagnato da icona e parola. Il feedback non usa il rosso. Dopo 2 errori la risposta giusta viene evidenziata (apprendimento senza errore). Niente suoni automatici, niente animazioni. Le tappe finite restano salvate nel browser di questo dispositivo. Il pulsante «Ricomincia», in alto, cancella tutto dopo una conferma.</p></details></article>';
  var first=0;while(done.indexOf(first)>=0&&first<6)first++;
  if(first>=6) navSet('Inizio',false,'Vedi la fine',true); else navSet('Inizio',false,'Comincio la tappa '+(first+1),true);
  nextB.onclick=function(){if(S.screen!=='home')return goNext(); if(first>=6){S.screen='end'}else{S={screen:'card',t:first,c:0}} render()};
  focusTitle();
}
function starsHtml(){var h='<div class="stars" aria-label="Stelle: '+done.length+' su 6">';for(var i=0;i<6;i++)h+='<span class="'+(done.indexOf(i)>=0?'':'off')+'">'+ic('star',true)+'</span>';return h+'</div>'}
function tappaDone(){
  var n=S.t+1, last=S.t===5;
  stage.innerHTML='<article class="card center"><h2>Tappa '+n+' finita!</h2>'+starsHtml()+'<p>Hai '+done.length+(done.length===1?' stella':' stelle')+' su 6.</p>'+
   (last?'<p>Hai finito tutte le tappe.</p>':'<p>Adesso puoi scegliere:</p><div class="choices">'+
   '<button type="button" class="opt" id="c-pause">'+ic('pause')+'Faccio una pausa di 2 minuti</button>'+
   '<button type="button" class="opt" id="c-go">'+ic('arrow')+'Vado alla tappa '+(n+1)+': '+T[n].name+'</button>'+
   '<button type="button" class="opt" id="c-stop">'+ic('home')+'Mi fermo per oggi</button></div>')+'</article>';
  if(last){navSet('Indietro',false,'Vedi la fine',true)}
  else{document.getElementById('c-pause').onclick=function(){S.screen='pause';render()};
       document.getElementById('c-go').onclick=function(){S={screen:'card',t:n,c:0};render()};
       document.getElementById('c-stop').onclick=function(){S.screen='stop';render()};
       navSet('Indietro',false,'Vado alla tappa '+(n+1),true)}
  focusTitle();
}
function pause(){
  var total=120,left=total,n=S.t+1;
  stage.innerHTML='<article class="card center"><div class="big-icons" style="justify-content:center" aria-hidden="true">'+ic('pause')+'</div><h2>Pausa.</h2><p>Puoi alzarti, bere un po\u2019 d\u2019acqua, guardare fuori.</p><div class="bar" aria-hidden="true"><div id="barf"></div></div><p id="left" role="status"></p><div class="choices"><button type="button" class="opt" id="endp">'+ic('arrow')+'Finisco la pausa</button></div></article>';
  function upd(){var m=Math.floor(left/60),s=left%60;document.getElementById('barf').style.width=((total-left)/total*100)+'%';
    document.getElementById('left').textContent=left>0?('Mancano '+(m?m+(m===1?' minuto':' minuti'):'')+(m&&s?' e ':'')+(s?s+' secondi':'')+'.'):'La pausa è finita. Quando vuoi, vai alla tappa '+(n+1)+'.'}
  upd(); timer=setInterval(function(){left--;upd();if(left<=0){clearInterval(timer);timer=null}},1000);
  function go(){S={screen:'card',t:n,c:0};render()}
  document.getElementById('endp').onclick=go;
  navSet('Indietro',false,'Vado alla tappa '+(n+1),true);
  focusTitle();
}
function stopDay(){
  var n=S.t+1;
  stage.innerHTML='<article class="card center"><h2>Bravo, per oggi hai finito.</h2>'+starsHtml()+'<p>La prossima volta cominci dalla <b>tappa '+(n+1)+': '+T[n].name+'</b>.</p></article>';
  navSet('Indietro',false,'Torno all\u2019inizio',true);
  focusTitle();
}
function endAll(){
  stage.innerHTML='<article class="card center"><h2>Hai finito tutte le tappe!</h2>'+starsHtml()+'<p>Ecco che cosa hai imparato:</p><ul class="learned">'+
  '<li>'+ic('pencil')+'Prima si scrive, poi si gira.</li><li>'+ic('list')+'Le 4 fasi: idea, soggetto, scaletta, sceneggiatura.</li>'+
  '<li>'+ic('pin')+'Una scena ha lo stesso posto e lo stesso tempo.</li><li>'+ic('script')+'L\u2019intestazione dice dove e quando.</li>'+
  '<li>'+ic('eye')+'La descrizione dice che cosa si vede e si sente.</li><li>'+ic('speech')+'Il dialogo: il nome e la battuta.</li></ul></article>';
  navSet('Indietro',false,'Torno all\u2019inizio',true);
  focusTitle();
}
var prev=null;
function confirmRestart(){
  stage.innerHTML='<article class="card center compact"><h2>Vuoi ricominciare da capo?</h2>'+
   '<p>Se scegli <b>sì</b>: le stelle si cancellano e ricominci dalla tappa 1.</p><p>Se scegli <b>no</b>: torni dove eri.</p>'+
   '<div class="choices"><button type="button" class="opt" id="r-yes">'+ic('retry')+'Sì, ricomincio da capo</button>'+
   '<button type="button" class="opt" id="r-no">'+ic('back')+'No, torno dove ero</button></div></article>';
  document.getElementById('r-yes').onclick=function(){done=[];solved={};prev=null;try{localStorage.removeItem('tappe-done');localStorage.removeItem('tappe-pos')}catch(e){}S={screen:'home',t:0,c:0};render()};
  document.getElementById('r-no').onclick=function(){S=prev||{screen:'home',t:0,c:0};prev=null;render()};
  navSet('Indietro',false,'Avanti',false,'');
  focusTitle();
}
document.getElementById('restart').innerHTML=ic('retry')+'Ricomincia';
document.getElementById('restart').onclick=function(){if(S.screen==='confirm')return;prev={screen:S.screen,t:S.t,c:S.c};S.screen='confirm';render()};
function goNext(){
  if(S.screen==='card'){var tp=T[S.t];
    if(S.c<tp.cards.length-1){S.c++}else{if(done.indexOf(S.t)<0)done.push(S.t);S.screen='tdone'}}
  else if(S.screen==='tdone'){if(S.t===5)S.screen='end';else S={screen:'card',t:S.t+1,c:0}}
  else if(S.screen==='pause'){S={screen:'card',t:S.t+1,c:0}}
  else if(S.screen==='stop'||S.screen==='end'){S={screen:'home',t:0,c:0}}
  else if(S.screen==='confirm'){return}
  render();
}
nextB.onclick=goNext;
backB.onclick=function(){if(S.screen==='card'&&S.c>0){S.c--;render()}};

/* ---------- lettura ad alta voce, solo a richiesta ---------- */
var synth=window.speechSynthesis||null, speaking=false;
function setListen(){listenB.innerHTML=(speaking?ic('stop')+'Ferma':ic('speaker')+'Ascolta');listenB.setAttribute('aria-label',speaking?'Ferma la lettura':'Ascolta questa carta')}
function stopSpeak(){if(synth)synth.cancel();speaking=false;setListen()}
listenB.onclick=function(){
  if(!synth){why.textContent='Questo browser non può leggere ad alta voce.';return}
  if(speaking){stopSpeak();return}
  var parts=[];stage.querySelectorAll('h2,p,li,.opt,.sp-row,.yesno div,.steps4 div').forEach(function(n){
    if(n.closest('details')||n.hidden)return; if(n.matches('p')&&n.closest('.yesno'))return;
    var t=n.textContent.replace(/\s+/g,' ').trim(); if(t&&!/^Carta \d/.test(t))parts.push(t)});
  var v=null,vs=synth.getVoices();for(var i=0;i<vs.length;i++){if(/^it/i.test(vs[i].lang)){v=vs[i];break}}
  speaking=true;setListen();
  parts.forEach(function(t,i){var u=new SpeechSynthesisUtterance(t.replace('INT.','interno').replace('EXT.','esterno'));u.lang='it-IT';u.rate=0.85;if(v)u.voice=v;
    if(i===parts.length-1)u.onend=function(){speaking=false;setListen()};synth.speak(u)});
};
setListen();

/* ---------- dimensione testo ---------- */
var sizes=[18,20,23,26],si=+(st('tappe-fs')||1);
function fs(){document.documentElement.style.setProperty('--fs',sizes[si]+'px');st('tappe-fs',si)}
document.getElementById('fs-down').onclick=function(){if(si>0){si--;fs()}};
document.getElementById('fs-up').onclick=function(){if(si<sizes.length-1){si++;fs()}};
fs();

/* ---------- ripresa ---------- */
try{var saved=JSON.parse(st('tappe-pos')||'null');if(saved&&saved.screen==='card'&&T[saved.t])S=saved}catch(e){}
render();
})();
</script>
