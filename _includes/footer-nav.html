<footer class="site-footer-nav">
<style>
footer.site-footer-nav {

.site-footer-nav .site-footer-nav__inner { max-width: 1100px; margin: 0 auto; }
.site-footer-nav .site-footer-nav__row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    margin: 0 0 0.7rem;
    padding: 0;
}
.site-footer-nav .site-footer-nav__label {

.site-footer-nav a:hover,
.site-footer-nav a:focus-visible { color: #e6edf3; }
/* Separatori "·" tra i link: ogni link ne ha uno davanti, e quello a inizio riga

.site-footer-nav .site-footer-nav__links a::before {
    content: "·";
    content: "·" / "";
    display: inline-block;
    width: 1.2rem;
    text-align: center;
    color: #6e7681;
}
.site-footer-nav .site-footer-nav__links a:hover::before,
.site-footer-nav .site-footer-nav__links a:focus-visible::before { color: #6e7681; }
.site-footer-nav p.site-footer-nav__id {

    color: #e6edf3;
    font-size: 0.85rem;
    text-align: left;
}
.site-footer-nav p.site-footer-nav__id span { white-space: nowrap; }
@media (max-width: 600px) {
    footer.site-footer-nav { padding: 1.5rem 1rem 1.75rem; }
    .site-footer-nav .site-footer-nav__label { flex-basis: 100%; margin: 0 0 0.2rem; }
    .site-footer-nav .site-footer-nav__links { flex-basis: 100%; }
    .site-footer-nav p.site-footer-nav__id span { white-space: normal; }
}
